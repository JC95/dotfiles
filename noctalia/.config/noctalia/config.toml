[theme]
mode = "dark"
source = "builtin"
builtin = "Tokyo-Night"

[wallpaper]
enabled = true
fill_mode = "fit" # center | crop | fit | stretch | repeat | span

directory = "/home/joe/.config/noctalia/wallpapers"

[wallpaper.default]
# path = "/home/joe/nixos-dotfiles/config/noctalia/wallpapers/tn1.png"
path = "/home/joe/.config/noctalia/wallpapers/tn1.png"

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true
password_style = "default"

[shell.session]
grid = false
grid_columns = 3

[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "reboot"
shortcut = "2"

[[shell.session.actions]]
action = "shutdown"
shortcut = "3"

[shell.launcher]
categories = false
fetch_exchange_rates = true

[keybinds]
validate = ["return", "kp_enter"]
cancel   = ["escape"]
left     = ["left", "ctrl+h"]
right    = ["right", "ctrl+l"]
up       = ["up", "ctrl+k"]
down     = ["down", "ctrl+j"]
tab_next = ["tab"]
tab_previous = ["shift+tab", "iso_left_tab"]

[location]
auto_locate = true

[weather]
enabled = true
refresh_minuted = 30
unit = "metric"
effects = true

[notification]
enable_daemon            = true       
show_app_name            = true       
show_actions             = true       
position                 = "top_right"
layer                    = "top"      
scale                    = 1.0        
background_opacity       = 0.97       
border                   = true       
offset_x                 = 20         
offset_y                 = 8          
monitors                 = []         
collapse_on_dismiss      = true       
history_retention_hours  = 0          

[notification.filter.spotify]
enabled = true
match = "spotify"
show_toast = false
save_history = false
play_sound = false
